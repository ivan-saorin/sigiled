# Control-plane compose: exactly what the supervisor launches on restart
# (default SUPERVISOR_RESTART_CMD = `docker compose up -d --build sigiled`,
# executed in SIGILED_REPO_DIR = this checkout).
# Live env lives in a `.env` next to this file, NEVER in git — see
# deploy/.env.example for the full annotated list. Minimum:
#   DOMAIN=example.com
#   GITHUB_OWNER=your-github-user
#   SIGILED_OIDC_BASE=https://auth.example.com
services:
  sigiled:
    build:
      context: .
      dockerfile: Dockerfile.sigiledd
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SIGILED_STATE_DIR: /data
      # Runtime dei workspace: attivalo (SIGILED_RUNTIME=docker) solo quando
      # il canary deve affittare container veri — serve il socket qui sotto,
      # la rete dello stack e le deploy key in /data/keys.
      SIGILED_RUNTIME: ${SIGILED_RUNTIME:-}
      SIGILED_NETWORK: ${SIGILED_NETWORK:-mgr-net}
    volumes:
      - sigiled-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    # The box's docker group id — `getent group docker | cut -d: -f3` —
    # so the process can drive the socket while running uid 1000, not root.
    group_add: ["${DOCKER_GID:-988}"]
    networks: [default, mgr-net]
    restart: unless-stopped

volumes:
  sigiled-data:
    name: sigiled-data

networks:
  mgr-net:
    external: true
    name: mgr-net

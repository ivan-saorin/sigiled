# Compose del canary v2: esattamente ciò che il supervisor lancia al restart
# (default SUPERVISOR_RESTART_CMD = `docker compose up -d --build sigiled`,
# eseguito in SIGILED_REPO_DIR = questo checkout).
# Le env vive stanno in un `.env` accanto a questo file, MAI in git:
#   SIGILED_BOOTSTRAP_BEARER=...   # bearer legacy: apre la finestra dual-auth
#   SIGILED_OIDC_BASE=https://auth.016180.xyz
services:
  sigiled:
    build:
      context: .
      dockerfile: Dockerfile.sigiledd
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SIGILED_STATE_DIR: /data
      # Runtime dei workspace: attivalo (SIGILED_RUNTIME=docker) solo quando
      # il canary deve affittare container veri — serve il socket qui sotto,
      # la rete dello stack e le deploy key in /data/keys.
      SIGILED_RUNTIME: ${SIGILED_RUNTIME:-}
      SIGILED_NETWORK: ${SIGILED_NETWORK:-mgr-net}
    volumes:
      - sigiled-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    # group_add 988 = gruppo docker del box: il processo gira 1000, non root.
    group_add: ["988"]
    networks: [default, mgr-net]
    restart: unless-stopped

volumes:
  sigiled-data:
    name: sigiled-data

networks:
  mgr-net:
    external: true
    name: mgr-net

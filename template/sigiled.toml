# SIGILED workload manifest. Schema: `sigiled` repo, docs/sigiled-contract.md §7-8.
# class: session | job | app
# source: repo | image

class = "session"
source = "repo"

# Template pin (DEC-05): which vm-tmpl this repo was generated from. The
# recepimento (tools/sync-template.sh) updates template-owned paths to a new
# tag ON DEMAND, never automatically; SIGILED exposes template_version and
# template_behind on the project record. Keep in sync with the Dockerfile's
# FROM vm-base tag.
template = "vm-tmpl@0.1.0"

# Session image (DEC-25): the dockerfile SIGILED builds this project's
# workspace containers from — content-addressed on the file's git blob, so
# only editing it triggers a rebuild (first open after the edit pays it).
# Remove the table to ride the global base image instead.
[workspace]
dockerfile = "Dockerfile"

# [jobs.<name>]                    # scheduled jobs — any number
# cron = "30 3 * * *"              # required; container-local time (TZ)
# command = "./jobs/recap.sh"      # required; bash -lc in /workspace
# timeout_minutes = 30             # 1..60, default 60 — hard wall clock
# hc_ping = "MY_JOB_HC_URL"        # optional: stack-env var with the ping URL
# [jobs.<name>.secrets]            # container env <- stack-env var
# ANTHROPIC_API_KEY = "JOB_ANTHROPIC_API_KEY"
# Each run: branch job-<name>-<stamp> off master, pushed immediately,
# NEVER merged — append-only, LLM-readable history.

# [app]                            # at most ONE resident app per project
# name = "my-app"                  # container = DNS name — the edge routes it
# dockerfile = "Dockerfile.api"    # default "Dockerfile"
# [app.volumes]
# my-app-data = "/data:rw"         # named volume -> "/abs/target:ro|rw"
# [app.secrets]
# TZ = "TZ"                        # container env <- stack env

[volumes]
# Declared mounts. ro is the default; rw must be explicit.
# "volume-name" = "ro" | "rw"

[secrets]
# Secret refs resolved by SIGILED at container creation; values never in git.
# ENV_NAME = "env-var-name-in-stack-env"

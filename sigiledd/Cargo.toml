[package]
name = "sigiledd"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "SIGILED v2 orchestrator — the control plane"

# Dependency policy (DEC-16, build plan): minimal and motivated.
# axum/tokio/serde*: the platform is an HTTP JSON service, same stack as vm-base.
# toml: sigiled.toml is the manifest format inherited from v1.
# tracing*: structured logs are the ops surface of a headless control plane.
# jsonwebtoken: the OIDC leg (design §1) validates RS256 JWTs locally via JWKS.
# reqwest (rustls, no default tls): JWKS fetch + device flow against the IdP —
#   the only outbound HTTP the control plane performs.
[dependencies]
# cron+chrono: the jobs scheduler (session 8) evaluates the classic 5-field
# cron of [jobs.*] in the control plane's local TZ (contract §7).
cron = "0.12"
chrono = "0.4"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# OS entropy for session identities and workspace bearer tokens.
getrandom = "0.2"
# PKCE S256, OIDC at_hash and stable human identity encoding.
sha2 = "0.10"
base64 = "0.22"

# Process-group termination and nonblocking pipes for bounded repository refresh.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.hyper]
version = "1"
features = ["client", "http1"]

[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]

[dependencies.http-body-util]
version = "0.1"

[dependencies.futures-util]
version = "0.3"

[dev-dependencies]
sigil-ide-agent = { path = "../ide-agent", features = ["test-support"] }

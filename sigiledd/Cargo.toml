[package]
name = "sigiledd"
version = "2.0.0-alpha.1"
edition = "2021"
description = "SIGILED v2 orchestrator — control plane of the automa stack"

# Dependency policy (DEC-16, build plan): minimal and motivated.
# axum/tokio/serde*: the platform is an HTTP JSON service, same stack as vm-base.
# toml: mgr.toml is the manifest format inherited from v1.
# tracing*: structured logs are the ops surface of a headless control plane.
[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
